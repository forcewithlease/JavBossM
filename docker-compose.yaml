services:
  javboss:
    # 由本仓库构建的镜像：docker build -t localjav:latest .
    # 也可用官方镜像：JAVBOSS_DOCKER_IMAGE=ghcr.io/solr159/javboss:latest docker compose up -d
    image: ${JAVBOSS_DOCKER_IMAGE:-localjav:latest}
    container_name: javboss
    user: "1000:1000"
    network_mode: host
    command: ["./javboss", "-port", "8655"]
    environment:
      JAVBOSS_PROXY_HOST_GATEWAY: "0"
      JAVBOSS_HOST_PATH_PREFIX: "1"
      TZ: Asia/Shanghai
    volumes:
      - ./docker-data:/app/data
      # 移动硬盘 AV 目录：容器内路径 = /host + 宿主机路径
      - /media/fang/移动硬盘1/AV:/host/media/fang/移动硬盘1/AV
      # 下载目录：aria2 容器挂到 /downloads，JavBoss 通过 /host 下的同一路径访问
      - /home/fang/data/downloads:/host/home/fang/data/downloads
      # 本地前端构建产物：开发移动端时直接预览 `web/dist`
      # 想恢复镜像自带前端，注释掉下面这一行再 `docker compose up -d` 即可
      - ./web/dist:/app/web/dist:ro
    restart: unless-stopped
